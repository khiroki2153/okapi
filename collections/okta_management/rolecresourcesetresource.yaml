---
name: RoleCResourceSetResource
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all resource set resources
  method: GET
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/resources"
- name: Add a resource set resource with conditions
  method: POST
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/resources"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      resourceOrnOrUrl: https://{yourOktaDomain}/api/v1/apps
      conditions:
        Exclude:
          okta:ORN:
          - orn:okta:idp:00o5rb5mt2H3d1TJd0h7:apps:0oa1014FmyZ2H0oRY0g4
          - orn:okta:idp:00o5rb5mt2H3d1TJd0h7:apps:slack
- name: Add more resources to a resource set
  method: PATCH
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/resources"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      additions:
      - https://{yourOktaDomain}/api/v1/groups/00guaxWZ0AOa5NFAj0g3
      - https://{yourOktaDomain}/api/v1/groups/00gu67DU2qNCjNZYO0g3/users
- name: Retrieve a resource set resource
  method: GET
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/resources/{{resourceId}}"
- name: Replace the resource set resource conditions
  method: PUT
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/resources/{{resourceId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      conditions:
        Exclude:
          okta:ORN:
          - orn:okta:idp:00o5rb5mt2H3d1TJd0h7:apps:0oa1014FmyZ2H0oRY0g4
          - orn:okta:idp:00o5rb5mt2H3d1TJd0h7:apps:slack
- name: Delete a resource set resource
  method: DELETE
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/resources/{{resourceId}}"
