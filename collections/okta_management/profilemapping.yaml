---
name: ProfileMapping
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all profile mappings
  method: GET
  url: "{{baseUrl}}/api/v1/mappings"
- name: Retrieve a profile mapping
  method: GET
  url: "{{baseUrl}}/api/v1/mappings/{{mappingId}}"
- name: Update a profile mapping
  method: POST
  url: "{{baseUrl}}/api/v1/mappings/{{mappingId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      properties:
        fullName:
          expression: user.firstName + user.lastName
          pushStatus: PUSH
        nickName:
          expression: user.nickName
          pushStatus: PUSH
