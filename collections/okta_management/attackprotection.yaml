---
name: AttackProtection
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve the authenticator settings
  method: GET
  url: "{{baseUrl}}/attack-protection/api/v1/authenticator-settings"
- name: Replace the authenticator settings
  method: PUT
  url: "{{baseUrl}}/attack-protection/api/v1/authenticator-settings"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve the user lockout settings
  method: GET
  url: "{{baseUrl}}/attack-protection/api/v1/user-lockout-settings"
- name: Replace the user lockout settings
  method: PUT
  url: "{{baseUrl}}/attack-protection/api/v1/user-lockout-settings"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
