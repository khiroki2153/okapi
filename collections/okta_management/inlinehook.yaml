---
name: InlineHook
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all inline hooks
  method: GET
  url: "{{baseUrl}}/api/v1/inlineHooks"
- name: Create an inline hook
  method: POST
  url: "{{baseUrl}}/api/v1/inlineHooks"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: Token hook with HTTP authentication
      type: com.okta.oauth2.tokens.transform
      version: 1.0.0
      channel:
        type: HTTP
        version: 1.0.0
        config:
          uri: https://example.com/tokenHook
          headers:
          - key: x-any-key
            value: my-header-value
          method: POST
          authScheme:
            type: HEADER
            key: Authorization
            value: my-shared-secret
- name: Retrieve an inline hook
  method: GET
  url: "{{baseUrl}}/api/v1/inlineHooks/{{inlineHookId}}"
- name: Replace an inline hook
  method: PUT
  url: "{{baseUrl}}/api/v1/inlineHooks/{{inlineHookId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: New name token hook with HTTP authentication
      version: 1.0.0
      channel:
        type: HTTP
        version: 1.0.0
        config:
          uri: https://example.com/tokenHook
          headers:
          - key: x-any-key
            value: my-header-value
          method: POST
          authScheme:
            type: HEADER
            key: Authorization
            value: my-shared-secret
- name: Update an inline hook
  method: POST
  url: "{{baseUrl}}/api/v1/inlineHooks/{{inlineHookId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: New name token hook with HTTP authentication
      version: 1.0.0
      channel:
        type: HTTP
        version: 1.0.0
        config:
          uri: https://example.com/tokenHook
          headers:
          - key: x-any-key
            value: my-header-value
          method: POST
          authScheme:
            type: HEADER
            key: Authorization
            value: my-shared-secret
- name: Delete an inline hook
  method: DELETE
  url: "{{baseUrl}}/api/v1/inlineHooks/{{inlineHookId}}"
- name: Execute an inline hook
  method: POST
  url: "{{baseUrl}}/api/v1/inlineHooks/{{inlineHookId}}/execute"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      eventId: 3o9jBzq1SmOGmmsDsqyyeQ
      eventTime: '2020-01-17T21:23:56.000Z'
      eventType: com.okta.user.credential.password.import
      eventTypeVersion: '1.0'
      contentType: application/json
      cloudEventVersion: '0.1'
      source: https://${yourOktaDomain}/api/v1/inlineHooks/cbl2ad6phv9fsPLcF0g7
      data:
        context:
          request:
            id: XiIl6wn7005Rr@fjYqeC7CCDBxw
            method: POST
            url:
              value: "/idp/idx/challenge/answer"
            ipAddress: 66.124.153.138
          credential:
            username: isaac.brock@example.com
            password: Okta
        action:
          credential: UNVERIFIED
- name: Activate an inline hook
  method: POST
  url: "{{baseUrl}}/api/v1/inlineHooks/{{inlineHookId}}/lifecycle/activate"
- name: Deactivate an inline hook
  method: POST
  url: "{{baseUrl}}/api/v1/inlineHooks/{{inlineHookId}}/lifecycle/deactivate"
