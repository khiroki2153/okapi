---
name: UserResources
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all assigned app links
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{id}}/appLinks"
- name: List all groups
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{id}}/groups"
- name: List all clients
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/clients"
- name: List all devices for an enrolled user
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/devices"
