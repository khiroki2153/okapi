---
name: RealmAssignment
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all realm assignments
  method: GET
  url: "{{baseUrl}}/api/v1/realm-assignments"
- name: Create a realm assignment
  method: POST
  url: "{{baseUrl}}/api/v1/realm-assignments"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      actions:
        assignUserToRealm:
          realmId: 00g1b7rvh0xPLKXFf0g5
      conditions:
        profileSourceId: 0oa4enoRyjwSCy5hx0g4
        expression:
          value: user.profile.role ==\"Manager\"
      name: Realm Assignment 1
      priority: 0
- name: List all realm assignment operations
  method: GET
  url: "{{baseUrl}}/api/v1/realm-assignments/operations"
- name: Execute a realm assignment
  method: POST
  url: "{{baseUrl}}/api/v1/realm-assignments/operations"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      assignmentId: 0pr1b7rxZj2ibQzfP0g5
- name: Retrieve a realm assignment
  method: GET
  url: "{{baseUrl}}/api/v1/realm-assignments/{{assignmentId}}"
- name: Replace a realm assignment
  method: PUT
  url: "{{baseUrl}}/api/v1/realm-assignments/{{assignmentId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      actions:
        assignUserToRealm:
          realmId: 00g1b7rvh0xPLKXFf0g5
      conditions:
        profileSourceId: 0oa4enoRyjwSCy5hx0g4
        expression:
          value: user.profile.role ==\"Manager\"
      name: Realm Assignment 1
      priority: 0
- name: Delete a realm assignment
  method: DELETE
  url: "{{baseUrl}}/api/v1/realm-assignments/{{assignmentId}}"
- name: Activate a realm assignment
  method: POST
  url: "{{baseUrl}}/api/v1/realm-assignments/{{assignmentId}}/lifecycle/activate"
- name: Deactivate a realm assignment
  method: POST
  url: "{{baseUrl}}/api/v1/realm-assignments/{{assignmentId}}/lifecycle/deactivate"
