---
name: RoleBTargetBGroup
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all group role app targets
  method: GET
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/roles/{{roleAssignmentId}}/targets/catalog/apps"
- name: Assign a group role app target
  method: PUT
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/roles/{{roleAssignmentId}}/targets/catalog/apps/{{appName}}"
- name: Unassign a group role app target
  method: DELETE
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/roles/{{roleAssignmentId}}/targets/catalog/apps/{{appName}}"
- name: Assign a group role app instance target
  method: PUT
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/roles/{{roleAssignmentId}}/targets/catalog/apps/{{appName}}/{{appId}}"
- name: Unassign a group role app instance target
  method: DELETE
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/roles/{{roleAssignmentId}}/targets/catalog/apps/{{appName}}/{{appId}}"
- name: List all group role group targets
  method: GET
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/roles/{{roleAssignmentId}}/targets/groups"
- name: Assign a group role group target
  method: PUT
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/roles/{{roleAssignmentId}}/targets/groups/{{targetGroupId}}"
- name: Unassign a group role group target
  method: DELETE
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/roles/{{roleAssignmentId}}/targets/groups/{{targetGroupId}}"
