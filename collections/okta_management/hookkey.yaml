---
name: HookKey
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all keys
  method: GET
  url: "{{baseUrl}}/api/v1/hook-keys"
- name: Create a key
  method: POST
  url: "{{baseUrl}}/api/v1/hook-keys"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve a public key
  method: GET
  url: "{{baseUrl}}/api/v1/hook-keys/public/{{keyId}}"
- name: Retrieve a key by ID
  method: GET
  url: "{{baseUrl}}/api/v1/hook-keys/{{id}}"
- name: Replace a key
  method: PUT
  url: "{{baseUrl}}/api/v1/hook-keys/{{id}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Delete a key
  method: DELETE
  url: "{{baseUrl}}/api/v1/hook-keys/{{id}}"
