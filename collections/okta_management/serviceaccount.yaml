---
name: ServiceAccount
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all app service accounts
  method: GET
  url: "{{baseUrl}}/privileged-access/api/v1/service-accounts"
- name: Create an app service account
  method: POST
  url: "{{baseUrl}}/privileged-access/api/v1/service-accounts"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve an app service account
  method: GET
  url: "{{baseUrl}}/privileged-access/api/v1/service-accounts/{{id}}"
- name: Delete an app service account
  method: DELETE
  url: "{{baseUrl}}/privileged-access/api/v1/service-accounts/{{id}}"
- name: Update an existing app service account
  method: PATCH
  url: "{{baseUrl}}/privileged-access/api/v1/service-accounts/{{id}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
