---
name: ServiceAccount
requests:
- name: ServiceAccount / List all app service accounts
  method: GET
  url: "{{baseUrl}}/privileged-access/api/v1/service-accounts"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: ServiceAccount / Create an app service account
  method: POST
  url: "{{baseUrl}}/privileged-access/api/v1/service-accounts"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: ServiceAccount / Retrieve an app service account
  method: GET
  url: "{{baseUrl}}/privileged-access/api/v1/service-accounts/{{id}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: ServiceAccount / Delete an app service account
  method: DELETE
  url: "{{baseUrl}}/privileged-access/api/v1/service-accounts/{{id}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: ServiceAccount / Update an existing app service account
  method: PATCH
  url: "{{baseUrl}}/privileged-access/api/v1/service-accounts/{{id}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: {}
