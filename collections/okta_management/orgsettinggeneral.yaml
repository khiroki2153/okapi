---
name: OrgSettingGeneral
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve the Org general settings
  method: GET
  url: "{{baseUrl}}/api/v1/org"
- name: Replace the Org general settings
  method: PUT
  url: "{{baseUrl}}/api/v1/org"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      address1: 100 1st St
      address2: 6th floor
      city: San Fransico
      companyName: okta
      country: United States
      endUserSupportHelpURL: support.okta.com
      phoneNumber: "+18887227871"
      postalCode: '94105'
      state: California
      supportPhoneNumber: "+18887227871"
      website: www.okta.com
- name: Update the Org general settings
  method: POST
  url: "{{baseUrl}}/api/v1/org"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      address1: 100 1st St
