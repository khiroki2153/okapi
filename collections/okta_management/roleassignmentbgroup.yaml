---
name: RoleAssignmentBGroup
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all group role assignments
  method: GET
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/roles"
- name: Assign a role to a group
  method: POST
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/roles"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve a group role assignment
  method: GET
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/roles/{{roleAssignmentId}}"
- name: Unassign a group role
  method: DELETE
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/roles/{{roleAssignmentId}}"
