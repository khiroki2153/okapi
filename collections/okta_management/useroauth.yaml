---
name: UserOAuth
requests:
- name: UserOAuth / List all refresh tokens for a client
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/clients/{{clientId}}/tokens"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: UserOAuth / Revoke all refresh tokens for a client
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}/clients/{{clientId}}/tokens"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: UserOAuth / Retrieve a refresh token for a client
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/clients/{{clientId}}/tokens/{{tokenId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: UserOAuth / Revoke a token for a client
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}/clients/{{clientId}}/tokens/{{tokenId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
