---
name: UserOAuth
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all refresh tokens for a client
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/clients/{{clientId}}/tokens"
- name: Revoke all refresh tokens for a client
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}/clients/{{clientId}}/tokens"
- name: Retrieve a refresh token for a client
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/clients/{{clientId}}/tokens/{{tokenId}}"
- name: Revoke a token for a client
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}/clients/{{clientId}}/tokens/{{tokenId}}"
