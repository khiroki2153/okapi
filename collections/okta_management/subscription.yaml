---
name: Subscription
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all subscriptions for a role
  method: GET
  url: "{{baseUrl}}/api/v1/roles/{{roleRef}}/subscriptions"
- name: Retrieve a subscription for a role
  method: GET
  url: "{{baseUrl}}/api/v1/roles/{{roleRef}}/subscriptions/{{notificationType}}"
- name: Subscribe a role to a specific notification type
  method: POST
  url: "{{baseUrl}}/api/v1/roles/{{roleRef}}/subscriptions/{{notificationType}}/subscribe"
- name: Unsubscribe a role from a specific notification type
  method: POST
  url: "{{baseUrl}}/api/v1/roles/{{roleRef}}/subscriptions/{{notificationType}}/unsubscribe"
- name: List all subscriptions for a user
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/subscriptions"
- name: Retrieve a subscription for a user
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/subscriptions/{{notificationType}}"
- name: Subscribe a user to a specific notification type
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{userId}}/subscriptions/{{notificationType}}/subscribe"
- name: Unsubscribe a user from a specific notification type
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{userId}}/subscriptions/{{notificationType}}/unsubscribe"
