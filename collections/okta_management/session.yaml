---
name: Session
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve a session
  method: GET
  url: "{{baseUrl}}/api/v1/sessions/{{sessionId}}"
- name: Revoke a session
  method: DELETE
  url: "{{baseUrl}}/api/v1/sessions/{{sessionId}}"
- name: Refresh a session
  method: POST
  url: "{{baseUrl}}/api/v1/sessions/{{sessionId}}/lifecycle/refresh"
