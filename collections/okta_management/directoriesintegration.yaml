---
name: DirectoriesIntegration
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Update an external directory group membership
  method: POST
  url: "{{baseUrl}}/api/v1/directories/{{appInstanceId}}/groups/modify"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      id: 00g1xucgTZFrziXg10g4
      parameters:
        action: ADD
        attribute: member
        values:
        - 00u1bh5efGKMsSiLv0g4
- name: Submit a query for AD Group
  method: POST
  url: "{{baseUrl}}/api/v1/directories/{{appInstanceId}}/groups/{{groupId}}/query"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve the results of an AD group query
  method: GET
  url: "{{baseUrl}}/api/v1/directories/{{appInstanceId}}/groups/{{groupId}}/query/{{resultId}}"
