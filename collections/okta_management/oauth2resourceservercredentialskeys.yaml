---
name: OAuth2ResourceServerCredentialsKeys
requests:
- name: OAuth2ResourceServerCredentialsKeys / List all Custom Authorization Server
    Public JSON Web Keys
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/resourceservercredentials/keys"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: OAuth2ResourceServerCredentialsKeys / Add a JSON Web Key
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/resourceservercredentials/keys"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
      kid: ASHJHGasa782333-Sla3x3POBiIxDreBCdZuFs5B
      kty: RSA
      use: enc
      e: AQAB
      "n": AJncrzOrouIUCSMlRL0HU.....Kuine49_CEVR4GPn=
      status: INACTIVE
- name: OAuth2ResourceServerCredentialsKeys / Retrieve a Custom Authorization Server
    Public JSON Web Key
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/resourceservercredentials/keys/{{keyId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: OAuth2ResourceServerCredentialsKeys / Delete a Custom Authorization Server
    Public JSON Web Key
  method: DELETE
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/resourceservercredentials/keys/{{keyId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: OAuth2ResourceServerCredentialsKeys / Activate a Custom Authorization Server
    Public JSON Web Key
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/resourceservercredentials/keys/{{keyId}}/lifecycle/activate"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: OAuth2ResourceServerCredentialsKeys / Deactivate a Custom Authorization Server
    Public JSON Web Key
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/resourceservercredentials/keys/{{keyId}}/lifecycle/deactivate"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
