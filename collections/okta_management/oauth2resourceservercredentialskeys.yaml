---
name: OAuth2ResourceServerCredentialsKeys
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all Custom Authorization Server Public JSON Web Keys
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/resourceservercredentials/keys"
- name: Add a JSON Web Key
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/resourceservercredentials/keys"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      kid: ASHJHGasa782333-Sla3x3POBiIxDreBCdZuFs5B
      kty: RSA
      use: enc
      e: AQAB
      "n": AJncrzOrouIUCSMlRL0HU.....Kuine49_CEVR4GPn=
      status: INACTIVE
- name: Retrieve a Custom Authorization Server Public JSON Web Key
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/resourceservercredentials/keys/{{keyId}}"
- name: Delete a Custom Authorization Server Public JSON Web Key
  method: DELETE
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/resourceservercredentials/keys/{{keyId}}"
- name: Activate a Custom Authorization Server Public JSON Web Key
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/resourceservercredentials/keys/{{keyId}}/lifecycle/activate"
- name: Deactivate a Custom Authorization Server Public JSON Web Key
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/resourceservercredentials/keys/{{keyId}}/lifecycle/deactivate"
