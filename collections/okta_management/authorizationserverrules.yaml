---
name: AuthorizationServerRules
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all policy rules
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies/{{policyId}}/rules"
- name: Create a policy rule
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies/{{policyId}}/rules"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      type: RESOURCE_ACCESS
      name: Default Policy Rule
      priority: 1
      conditions:
        people:
          groups:
            include:
            - EVERYONE
        grantTypes:
          include:
          - implicit
          - client_credentials
          - authorization_code
          - password
        scopes:
          include:
          - "*"
      actions:
        token:
          accessTokenLifetimeMinutes: 60
          refreshTokenLifetimeMinutes: 0
          refreshTokenWindowMinutes: 10080
          inlineHook:
            id: cal4egvp1mbMldrYN0g7
- name: Retrieve a policy rule
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies/{{policyId}}/rules/{{ruleId}}"
- name: Replace a policy rule
  method: PUT
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies/{{policyId}}/rules/{{ruleId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      type: RESOURCE_ACCESS
      name: Default Policy Rule
      priority: 1
      status: ACTIVE
      conditions:
        people:
          groups:
            include:
            - EVERYONE
        grantTypes:
          include:
          - implicit
          - client_credentials
          - authorization_code
          - password
        scopes:
          include:
          - "*"
      actions:
        token:
          accessTokenLifetimeMinutes: 60
          refreshTokenLifetimeMinutes: 0
          refreshTokenWindowMinutes: 10080
          inlineHook:
            id: cal4egvp1mbMldrYN0g7
- name: Delete a policy rule
  method: DELETE
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies/{{policyId}}/rules/{{ruleId}}"
- name: Activate a policy rule
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies/{{policyId}}/rules/{{ruleId}}/lifecycle/activate"
- name: Deactivate a policy rule
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies/{{policyId}}/rules/{{ruleId}}/lifecycle/deactivate"
