---
name: UserFactor
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all YubiKey OTP tokens
  method: GET
  url: "{{baseUrl}}/api/v1/org/factors/yubikey_token/tokens"
- name: Upload a YubiKey OTP seed
  method: POST
  url: "{{baseUrl}}/api/v1/org/factors/yubikey_token/tokens"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      serialNumber: '7886622'
      publicId: ccccccijgibu
      privateId: b74be6169486
      aesKey: 1fcc6d8ce39bf1604e0b17f3e0a11067
- name: Retrieve a YubiKey OTP token
  method: GET
  url: "{{baseUrl}}/api/v1/org/factors/yubikey_token/tokens/{{tokenId}}"
- name: List all enrolled factors
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/factors"
- name: Enroll a factor
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{userId}}/factors"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      question:
        summary: question factor
        value:
          factorType: question
          provider: OKTA
          profile:
            question: disliked_food
            answer: mayonnaise
- name: List all supported factors
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/factors/catalog"
- name: List all supported security questions
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/factors/questions"
- name: Retrieve a factor
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/factors/{{factorId}}"
- name: Unenroll a factor
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}/factors/{{factorId}}"
- name: Activate a factor
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{userId}}/factors/{{factorId}}/lifecycle/activate"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      passCode: '123456'
- name: Resend a factor enrollment
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{userId}}/factors/{{factorId}}/resend"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      factorType: sms
      provider: OKTA
      profile:
        phoneNumber: "+1-555-415-1337"
- name: Retrieve a factor transaction status
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/factors/{{factorId}}/transactions/{{transactionId}}"
- name: Verify a factor
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{userId}}/factors/{{factorId}}/verify"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      passCode: '123456'
