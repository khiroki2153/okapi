---
name: PrincipalRateLimit
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all principal rate limits
  method: GET
  url: "{{baseUrl}}/api/v1/principal-rate-limits"
- name: Create a principal rate limit
  method: POST
  url: "{{baseUrl}}/api/v1/principal-rate-limits"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      principalId: prlh5hd6act3aHDrr1f5
      principalType: SSWS_TOKEN
      defaultPercentage: 50
      defaultConcurrencyPercentage: 75
- name: Retrieve a principal rate limit
  method: GET
  url: "{{baseUrl}}/api/v1/principal-rate-limits/{{principalRateLimitId}}"
- name: Replace a principal rate limit
  method: PUT
  url: "{{baseUrl}}/api/v1/principal-rate-limits/{{principalRateLimitId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      principalId: prlh5hd6act3aHDrr1f5
      principalType: SSWS_TOKEN
      defaultPercentage: 50
      defaultConcurrencyPercentage: 75
