---
name: UserLifecycle
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Activate a user
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{id}}/lifecycle/activate"
- name: Deactivate a user
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{id}}/lifecycle/deactivate"
- name: Reactivate a user
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{id}}/lifecycle/reactivate"
- name: Reset the factors
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{id}}/lifecycle/reset_factors"
- name: Suspend a user
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{id}}/lifecycle/suspend"
- name: Unlock a user
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{id}}/lifecycle/unlock"
- name: Unsuspend a user
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{id}}/lifecycle/unsuspend"
