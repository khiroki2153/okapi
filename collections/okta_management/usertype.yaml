---
name: UserType
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all user types
  method: GET
  url: "{{baseUrl}}/api/v1/meta/types/user"
- name: Create a user type
  method: POST
  url: "{{baseUrl}}/api/v1/meta/types/user"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      description: A new custom user type
      displayName: New user type
      name: newUserType
- name: Retrieve a user type
  method: GET
  url: "{{baseUrl}}/api/v1/meta/types/user/{{typeId}}"
- name: Replace a user type
  method: PUT
  url: "{{baseUrl}}/api/v1/meta/types/user/{{typeId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      displayName: Replacement Display Name
      description: Replacement description
      name: newUserType
- name: Update a user type
  method: POST
  url: "{{baseUrl}}/api/v1/meta/types/user/{{typeId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      displayName: Updated Display Name
- name: Delete a user type
  method: DELETE
  url: "{{baseUrl}}/api/v1/meta/types/user/{{typeId}}"
