---
name: UserCred
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Expire the password
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{id}}/lifecycle/expire_password"
- name: Expire the password with a temporary password
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{id}}/lifecycle/expire_password_with_temp_password"
- name: Reset a password
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{id}}/lifecycle/reset_password"
- name: Update password
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{userId}}/credentials/change_password"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      oldPassword:
        value: tlpWENT2m
      newPassword:
        value: uTVM,TPw55
      revokeSessions: true
- name: Update recovery question
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{userId}}/credentials/change_recovery_question"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      password:
        value: tlpWENT2m
      recovery_question:
        question: How many roads must a man walk down?
        answer: forty two
- name: Start forgot password flow
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{userId}}/credentials/forgot_password"
- name: Reset password with recovery question
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{userId}}/credentials/forgot_password_recovery_question"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      password:
        value: uTVM,TPw55
      recovery_question:
        answer: Annie Oakley
