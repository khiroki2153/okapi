---
name: Template
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all SMS templates
  method: GET
  url: "{{baseUrl}}/api/v1/templates/sms"
- name: Create an SMS template
  method: POST
  url: "{{baseUrl}}/api/v1/templates/sms"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: Custom
      type: SMS_VERIFY_CODE
      template: "${org.name}: your verification code is ${code}"
      translations:
        es: "${org.name}: el código de verificación es ${code}"
        fr: "${org.name}: votre code de vérification est ${code}"
        it: "${org.name}: il codice di verifica è ${code}"
- name: Retrieve an SMS template
  method: GET
  url: "{{baseUrl}}/api/v1/templates/sms/{{templateId}}"
- name: Replace an SMS template
  method: PUT
  url: "{{baseUrl}}/api/v1/templates/sms/{{templateId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: Custom
      type: SMS_VERIFY_CODE
      template: "${org.name}: your verification code is ${code}"
      translations:
        es: "${org.name}: el código de verificación es ${code}"
        fr: "${org.name}: votre code de vérification est ${code}"
        it: "${org.name}: il codice di verifica è ${code}"
- name: Update an SMS template
  method: POST
  url: "{{baseUrl}}/api/v1/templates/sms/{{templateId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      translations:
        de: "${org.name}: ihre bestätigungscode ist ${code}."
- name: Delete an SMS template
  method: DELETE
  url: "{{baseUrl}}/api/v1/templates/sms/{{templateId}}"
