---
name: EmailServer
requests:
- name: EmailServer / List all enrolled SMTP servers
  method: GET
  url: "{{baseUrl}}/api/v1/email-servers"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: EmailServer / Create a custom SMTP server
  method: POST
  url: "{{baseUrl}}/api/v1/email-servers"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
      alias: CustomServer1
      enabled: true
      authType: BASIC_SMTP_AUTH
      host: smtp.example.com
      port: 587
      username: user@example.com
      password: securepassword
- name: EmailServer / Retrieve an SMTP server configuration
  method: GET
  url: "{{baseUrl}}/api/v1/email-servers/{{emailServerId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: EmailServer / Delete an SMTP server configuration
  method: DELETE
  url: "{{baseUrl}}/api/v1/email-servers/{{emailServerId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: EmailServer / Update an SMTP server configuration
  method: PATCH
  url: "{{baseUrl}}/api/v1/email-servers/{{emailServerId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
      alias: CustomServer1 New Alias
      password: New password
- name: EmailServer / Test an SMTP server configuration
  method: POST
  url: "{{baseUrl}}/api/v1/email-servers/{{emailServerId}}/test"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: {}
