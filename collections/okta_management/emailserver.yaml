---
name: EmailServer
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all enrolled SMTP servers
  method: GET
  url: "{{baseUrl}}/api/v1/email-servers"
- name: Create a custom SMTP server
  method: POST
  url: "{{baseUrl}}/api/v1/email-servers"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      alias: CustomServer1
      enabled: true
      authType: BASIC_SMTP_AUTH
      host: smtp.example.com
      port: 587
      username: user@example.com
      password: securepassword
- name: Retrieve an SMTP server configuration
  method: GET
  url: "{{baseUrl}}/api/v1/email-servers/{{emailServerId}}"
- name: Delete an SMTP server configuration
  method: DELETE
  url: "{{baseUrl}}/api/v1/email-servers/{{emailServerId}}"
- name: Update an SMTP server configuration
  method: PATCH
  url: "{{baseUrl}}/api/v1/email-servers/{{emailServerId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      alias: CustomServer1 New Alias
      password: New password
- name: Test an SMTP server configuration
  method: POST
  url: "{{baseUrl}}/api/v1/email-servers/{{emailServerId}}/test"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
