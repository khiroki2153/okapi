---
name: DisasterRecovery
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Start the failback of your org
  method: POST
  url: "{{baseUrl}}/api/v1/dr/failback"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      domains:
      - yourOktaDomain.okta.com
- name: Start the failover of your org
  method: POST
  url: "{{baseUrl}}/api/v1/dr/failover"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      domains:
      - yourOktaDomain.okta.com
- name: Retrieve the disaster recovery status for all domains
  method: GET
  url: "{{baseUrl}}/api/v1/dr/status"
- name: Retrieve the disaster recovery status for a domain
  method: GET
  url: "{{baseUrl}}/api/v1/dr/status/{{domain}}"
