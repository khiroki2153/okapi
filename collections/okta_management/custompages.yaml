---
name: CustomPages
requests:
- name: CustomPages / Retrieve the error page sub-resources
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: CustomPages / Retrieve the customized error page
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/customized"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: CustomPages / Replace the customized error page
  method: PUT
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/customized"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: CustomPages / Delete the customized error page
  method: DELETE
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/customized"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: CustomPages / Retrieve the default error page
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/default"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: CustomPages / Retrieve the preview error page preview
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/preview"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: CustomPages / Replace the preview error page
  method: PUT
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/preview"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: CustomPages / Delete the preview error page
  method: DELETE
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/preview"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: CustomPages / Retrieve the sign-in page sub-resources
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-in"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: CustomPages / Retrieve the customized sign-in page
