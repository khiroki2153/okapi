---
name: CustomPages
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve the error page sub-resources
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error"
- name: Retrieve the customized error page
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/customized"
- name: Replace the customized error page
  method: PUT
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/customized"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Delete the customized error page
  method: DELETE
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/customized"
- name: Retrieve the default error page
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/default"
- name: Retrieve the preview error page preview
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/preview"
- name: Replace the preview error page
  method: PUT
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/preview"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Delete the preview error page
  method: DELETE
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/error/preview"
- name: Retrieve the sign-in page sub-resources
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-in"
- name: Retrieve the customized sign-in page
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-in/customized"
- name: Replace the customized sign-in page
  method: PUT
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-in/customized"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Delete the customized sign-in page
  method: DELETE
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-in/customized"
- name: Retrieve the default sign-in page
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-in/default"
- name: Retrieve the preview sign-in page preview
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-in/preview"
- name: Replace the preview sign-in page
  method: PUT
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-in/preview"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Delete the preview sign-in page
  method: DELETE
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-in/preview"
- name: List all Sign-In Widget versions
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-in/widget-versions"
- name: Retrieve the sign-out page settings
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-out/customized"
- name: Replace the sign-out page settings
  method: PUT
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-out/customized"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
