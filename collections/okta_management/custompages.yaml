  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: CustomPages / Retrieve the sign-out page settings
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-out/customized"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: CustomPages / Replace the sign-out page settings
