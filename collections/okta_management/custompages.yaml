  body:
    type: json
    content: {}
- name: CustomPages / Delete the customized sign-in page
  method: DELETE
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-in/customized"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: CustomPages / Retrieve the default sign-in page
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/pages/sign-in/default"
  headers:
    Authorization: SSWS {{apiToken}}
