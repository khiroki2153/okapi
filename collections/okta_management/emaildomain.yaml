---
name: EmailDomain
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all email domains
  method: GET
  url: "{{baseUrl}}/api/v1/email-domains"
- name: Create an email domain
  method: POST
  url: "{{baseUrl}}/api/v1/email-domains"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      displayName: Admin
      userName: admin
      domain: example.com
      brandId: bnd100iSrkcN6aR680g1
      validationSubdomain: mail
- name: Retrieve an email domain
  method: GET
  url: "{{baseUrl}}/api/v1/email-domains/{{emailDomainId}}"
- name: Replace an email domain
  method: PUT
  url: "{{baseUrl}}/api/v1/email-domains/{{emailDomainId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      displayName: IT Admin
      userName: noreply
- name: Delete an email domain
  method: DELETE
  url: "{{baseUrl}}/api/v1/email-domains/{{emailDomainId}}"
- name: Verify an email domain
  method: POST
  url: "{{baseUrl}}/api/v1/email-domains/{{emailDomainId}}/verify"
