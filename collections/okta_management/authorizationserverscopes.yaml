---
name: AuthorizationServerScopes
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all custom token scopes
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/scopes"
- name: Create a custom token scope
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/scopes"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: car:drive
      description: Drive car
      consent: REQUIRED
      displayName: Saml Jackson
- name: Retrieve a custom token scope
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/scopes/{{scopeId}}"
- name: Replace a custom token scope
  method: PUT
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/scopes/{{scopeId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      description: Order car
      name: car:order
      metadataPublish: ALL_CLIENTS
- name: Delete a custom token scope
  method: DELETE
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/scopes/{{scopeId}}"
