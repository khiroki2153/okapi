---
name: PushProvider
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all push providers
  method: GET
  url: "{{baseUrl}}/api/v1/push-providers"
- name: Create a push provider
  method: POST
  url: "{{baseUrl}}/api/v1/push-providers"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: APNs Example
      providerType: APNS
      configuration:
        keyId: KEY_ID
        teamId: TEAM_ID
        tokenSigningKey: "-----BEGIN PRIVATE KEY-----\\nPRIVATE_KEY\\n-----END PRIVATE
          KEY-----\\n"
        fileName: fileName.p8
- name: Retrieve a push provider
  method: GET
  url: "{{baseUrl}}/api/v1/push-providers/{{pushProviderId}}"
- name: Replace a push provider
  method: PUT
  url: "{{baseUrl}}/api/v1/push-providers/{{pushProviderId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: APNs Example
      providerType: APNS
      configuration:
        keyId: KEY_ID
        teamId: TEAM_ID
        tokenSigningKey: "-----BEGIN PRIVATE KEY-----\\nPRIVATE_KEY\\n-----END PRIVATE
          KEY-----\\n"
        fileName: fileName.p8
- name: Delete a push provider
  method: DELETE
  url: "{{baseUrl}}/api/v1/push-providers/{{pushProviderId}}"
