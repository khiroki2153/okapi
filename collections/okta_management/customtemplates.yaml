---
name: CustomTemplates
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all email templates
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email"
- name: Retrieve an email template
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}"
- name: List all email customizations
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}/customizations"
- name: Create an email customization
  method: POST
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}/customizations"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      language: fr
      subject: Bienvenue dans ${org.name}!
      body: <!DOCTYPE html><html><body><p>Bonjour ${user.profile.firstName}. <a href="${activationLink}">Activer
        le compte</a></p></body></html>
      isDefault: false
- name: Delete all email customizations
  method: DELETE
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}/customizations"
- name: Retrieve an email customization
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}/customizations/{{customizationId}}"
- name: Replace an email customization
  method: PUT
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}/customizations/{{customizationId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      language: fr
      subject: Bienvenue dans ${org.name}!
      body: <!DOCTYPE html><html><body><p>Bonjour ${user.profile.firstName}. <a href="${activationLink}">Activer
        le compte</a></p></body></html>
      isDefault: false
- name: Delete an email customization
  method: DELETE
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}/customizations/{{customizationId}}"
- name: Retrieve a preview of an email customization
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}/customizations/{{customizationId}}/preview"
- name: Retrieve an email template default content
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}/default-content"
- name: Retrieve a preview of the email template default content
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}/default-content/preview"
- name: Retrieve the email template settings
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}/settings"
- name: Replace the email template settings
  method: PUT
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}/settings"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Send a test email
  method: POST
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/templates/email/{{templateName}}/test"
