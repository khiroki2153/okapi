---
name: OrgSettingCustomization
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve the org preferences
  method: GET
  url: "{{baseUrl}}/api/v1/org/preferences"
- name: Set the hide dashboard footer preference
  method: POST
  url: "{{baseUrl}}/api/v1/org/preferences/hideEndUserFooter"
- name: Set the show dashboard footer preference
  method: POST
  url: "{{baseUrl}}/api/v1/org/preferences/showEndUserFooter"
