---
name: RoleAssignmentAUser
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all users with role assignments
  method: GET
  url: "{{baseUrl}}/api/v1/iam/assignees/users"
- name: List all user role assignments
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles"
- name: Assign a user role
  method: POST
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve a user role assignment
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}"
- name: Unassign a user role
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}"
- name: Retrieve all user role governance sources
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}/governance"
- name: Retrieve a user role governance source
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}/governance/{{grantId}}"
- name: Retrieve the user role governance source resources
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}/governance/{{grantId}}/resources"
