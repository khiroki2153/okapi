---
name: DeviceAssurance
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all device assurance policies
  method: GET
  url: "{{baseUrl}}/api/v1/device-assurances"
- name: Create a device assurance policy
  method: POST
  url: "{{baseUrl}}/api/v1/device-assurances"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: Device assurance Android
      osVersion:
        minimum: '12'
      diskEncryptionType:
        include:
        - USER
        - FULL
      jailbreak: false
      platform: ANDROID
      screenLockType:
        include:
        - BIOMETRIC
      secureHardwarePresent: true
- name: Retrieve a device assurance policy
  method: GET
  url: "{{baseUrl}}/api/v1/device-assurances/{{deviceAssuranceId}}"
- name: Replace a device assurance policy
  method: PUT
  url: "{{baseUrl}}/api/v1/device-assurances/{{deviceAssuranceId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: Device assurance Android
      osVersion:
        minimum: '12'
      diskEncryptionType:
        include:
        - USER
        - FULL
      jailbreak: false
      platform: ANDROID
      screenLockType:
        include:
        - BIOMETRIC
      secureHardwarePresent: true
- name: Delete a device assurance policy
  method: DELETE
  url: "{{baseUrl}}/api/v1/device-assurances/{{deviceAssuranceId}}"
