---
name: LinkedObject
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all linked object definitions
  method: GET
  url: "{{baseUrl}}/api/v1/meta/schemas/user/linkedObjects"
- name: Create a linked object definition
  method: POST
  url: "{{baseUrl}}/api/v1/meta/schemas/user/linkedObjects"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      primary:
        name: manager
        title: manager
        description: Manager link property
        type: USER
      associated:
        name: subordinate
        title: subordinate
        description: Subordinate link property
        type: USER
- name: Retrieve a linked object definition
  method: GET
  url: "{{baseUrl}}/api/v1/meta/schemas/user/linkedObjects/{{linkedObjectName}}"
- name: Delete a linked object definition
  method: DELETE
  url: "{{baseUrl}}/api/v1/meta/schemas/user/linkedObjects/{{linkedObjectName}}"
