---
name: CustomDomain
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all custom domains
  method: GET
  url: "{{baseUrl}}/api/v1/domains"
- name: Create a custom domain
  method: POST
  url: "{{baseUrl}}/api/v1/domains"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve a custom domain
  method: GET
  url: "{{baseUrl}}/api/v1/domains/{{domainId}}"
- name: Replace a custom domain's brand
  method: PUT
  url: "{{baseUrl}}/api/v1/domains/{{domainId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Delete a custom domain
  method: DELETE
  url: "{{baseUrl}}/api/v1/domains/{{domainId}}"
- name: Upsert the custom domain's certificate
  method: PUT
  url: "{{baseUrl}}/api/v1/domains/{{domainId}}/certificate"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Verify a custom domain
  method: POST
  url: "{{baseUrl}}/api/v1/domains/{{domainId}}/verify"
