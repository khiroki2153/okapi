---
name: SSFTransmitter
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve the SSF transmitter metadata
  method: GET
  url: "{{baseUrl}}/.well-known/ssf-configuration"
- name: Retrieve the SSF stream configuration(s)
  method: GET
  url: "{{baseUrl}}/api/v1/ssf/stream"
- name: Replace an SSF stream
  method: PUT
  url: "{{baseUrl}}/api/v1/ssf/stream"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Create an SSF stream
  method: POST
  url: "{{baseUrl}}/api/v1/ssf/stream"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Delete an SSF stream
  method: DELETE
  url: "{{baseUrl}}/api/v1/ssf/stream"
- name: Update an SSF stream
  method: PATCH
  url: "{{baseUrl}}/api/v1/ssf/stream"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve the SSF stream status
  method: GET
  url: "{{baseUrl}}/api/v1/ssf/stream/status"
- name: Verify an SSF stream
  method: POST
  url: "{{baseUrl}}/api/v1/ssf/stream/verification"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
