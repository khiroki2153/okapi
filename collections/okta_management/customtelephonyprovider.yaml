---
name: CustomTelephonyProvider
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all custom telephony providers
  method: GET
  url: "{{baseUrl}}/api/v1/telephony-providers"
- name: Create a custom telephony provider
  method: POST
  url: "{{baseUrl}}/api/v1/telephony-providers"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      providerAuthToken: 11a9b6c435967abe806f4f0d6ec0f382
      providerCapability: ALL
      providerName: TWILIO
      providerSid: ACb49fb19a09b2f5d2f121fe1c207689dt
      providerSettings:
        sms:
          twilioPhoneNumber: "+1234567890"
        call:
          twilioVerifySid: example-verify-sid
- name: Retrieve a custom telephony provider
  method: GET
  url: "{{baseUrl}}/api/v1/telephony-providers/{{customTelephonyProviderId}}"
- name: Delete a custom telephony provider
  method: DELETE
  url: "{{baseUrl}}/api/v1/telephony-providers/{{customTelephonyProviderId}}"
- name: Update a custom telephony provider credential
  method: PATCH
  url: "{{baseUrl}}/api/v1/telephony-providers/{{customTelephonyProviderId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      id: oct3v00k4iOFlEJmQ806
      providerAuthToken: 11a9b6c435967abe806f4f0d6ec0f382
      providerSid: ACb49fb19a09b2f5d2f121fe1c207689dt
      providerSettings:
        sms:
          twilioPhoneNumber: "+1234567890"
        call:
          twilioVerifySid: updated-verify-sid
- name: Activate a custom telephony provider
  method: POST
  url: "{{baseUrl}}/api/v1/telephony-providers/{{customTelephonyProviderId}}/lifecycle/activate"
- name: Deactivate a custom telephony provider
  method: POST
  url: "{{baseUrl}}/api/v1/telephony-providers/{{customTelephonyProviderId}}/lifecycle/deactivate"
- name: Set a custom telephony provider as a primary telephony provider
  method: POST
  url: "{{baseUrl}}/api/v1/telephony-providers/{{customTelephonyProviderId}}/setAsPrimary"
- name: Send a test message from a custom telephony provider
  method: POST
  url: "{{baseUrl}}/api/v1/telephony-providers/{{customTelephonyProviderId}}/test"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      factor: SMS
      phoneNumber: "+1234567890"
      countryCodeIso2: US
