---
name: RoleCResourceSet
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all resource sets
  method: GET
  url: "{{baseUrl}}/api/v1/iam/resource-sets"
- name: Create a resource set
  method: POST
  url: "{{baseUrl}}/api/v1/iam/resource-sets"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      label: SF-IT-People
      description: People in the IT department of San Francisco
      resources:
      - https://{yourOktaDomain}/api/v1/groups/00guaxWZ0AOa5NFAj0g3
      - https://{yourOktaDomain}/api/v1/groups/00gu67DU2qNCjNZYO0g3/users
      - https://{yourOktaDomain}/api/v1/users
      - https://{yourOktaDomain}/api/v1/realms/00guaxWZ0AOa5NFAj0g3
      - https://{yourOktaDomain}/api/v1/realms
- name: Retrieve a resource set
  method: GET
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}"
- name: Replace a resource set
  method: PUT
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      label: SF-IT-People
      description: People in the IT department of San Francisco
- name: Delete a resource set
  method: DELETE
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}"
