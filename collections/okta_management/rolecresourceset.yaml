---
name: RoleCResourceSet
requests:
- name: RoleCResourceSet / List all resource sets
  method: GET
  url: "{{baseUrl}}/api/v1/iam/resource-sets"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: RoleCResourceSet / Create a resource set
  method: POST
  url: "{{baseUrl}}/api/v1/iam/resource-sets"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
      label: SF-IT-People
      description: People in the IT department of San Francisco
      resources:
      - https://{yourOktaDomain}/api/v1/groups/00guaxWZ0AOa5NFAj0g3
      - https://{yourOktaDomain}/api/v1/groups/00gu67DU2qNCjNZYO0g3/users
      - https://{yourOktaDomain}/api/v1/users
      - https://{yourOktaDomain}/api/v1/realms/00guaxWZ0AOa5NFAj0g3
      - https://{yourOktaDomain}/api/v1/realms
- name: RoleCResourceSet / Retrieve a resource set
  method: GET
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: RoleCResourceSet / Replace a resource set
  method: PUT
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
      label: SF-IT-People
      description: People in the IT department of San Francisco
- name: RoleCResourceSet / Delete a resource set
  method: DELETE
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
