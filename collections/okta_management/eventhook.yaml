---
name: EventHook
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all event hooks
  method: GET
  url: "{{baseUrl}}/api/v1/eventHooks"
- name: Create an event hook
  method: POST
  url: "{{baseUrl}}/api/v1/eventHooks"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: Event Hook Test
      events:
        type: EVENT_TYPE
        items:
        - group.user_membership.add
      channel:
        type: HTTP
        version: 1.0.0
        config:
          uri: https://example_external_service/userAdded
          headers:
          - key: X-Other-Header
            value: my-header-value
          authScheme:
            type: HEADER
            key: Authorization
            value: my-shared-secret
- name: Retrieve an event hook
  method: GET
  url: "{{baseUrl}}/api/v1/eventHooks/{{eventHookId}}"
- name: Replace an event hook
  method: PUT
  url: "{{baseUrl}}/api/v1/eventHooks/{{eventHookId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: Event Hook with Filter
      description: An event hook using an Okta Expression Language filter
      events:
        type: EVENT_TYPE
        items:
        - group.user_membership.add
        filter:
          type: EXPRESSION_LANGUAGE
          eventFilterMap:
          - event: group.user_membership.add
            condition:
              expression: event.target.?[type eq 'UserGroup'].size()>0 && event.target.?[displayName
                eq 'Sales'].size()>0
      channel:
        type: HTTP
        version: 1.0.0
        config:
          uri: https://example_external_service/userAdded
          authScheme:
            type: HEADER
            key: Authorization
            value: my-shared-secret
- name: Delete an event hook
  method: DELETE
  url: "{{baseUrl}}/api/v1/eventHooks/{{eventHookId}}"
- name: Activate an event hook
  method: POST
  url: "{{baseUrl}}/api/v1/eventHooks/{{eventHookId}}/lifecycle/activate"
- name: Deactivate an event hook
  method: POST
  url: "{{baseUrl}}/api/v1/eventHooks/{{eventHookId}}/lifecycle/deactivate"
- name: Verify an event hook
  method: POST
  url: "{{baseUrl}}/api/v1/eventHooks/{{eventHookId}}/lifecycle/verify"
