---
name: AuthorizationServer
requests:
- name: AuthorizationServer / List all authorization servers
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: AuthorizationServer / Create an authorization server
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
      name: Sample Authorization Server
      description: Sample Authorization Server description
      audiences:
      - api://default
- name: AuthorizationServer / Retrieve an authorization server
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: AuthorizationServer / Replace an authorization server
  method: PUT
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
      name: New Authorization Server
      description: Authorization Server description
      audiences:
      - api://default
      credentials:
        signing:
          rotationMode: AUTO
          use: sig
      issuer: https://{yourOktaDomain}/oauth2/{authorizationServerId}
      issuerMode: ORG_URL
      status: ACTIVE
- name: AuthorizationServer / Delete an authorization server
  method: DELETE
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: AuthorizationServer / Activate an authorization server
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/lifecycle/activate"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: AuthorizationServer / Deactivate an authorization server
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/lifecycle/deactivate"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
