---
name: AuthorizationServer
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all authorization servers
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers"
- name: Create an authorization server
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: Sample Authorization Server
      description: Sample Authorization Server description
      audiences:
      - api://default
- name: Retrieve an authorization server
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}"
- name: Replace an authorization server
  method: PUT
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: New Authorization Server
      description: Authorization Server description
      audiences:
      - api://default
      credentials:
        signing:
          rotationMode: AUTO
          use: sig
      issuer: https://{yourOktaDomain}/oauth2/{authorizationServerId}
      issuerMode: ORG_URL
      status: ACTIVE
- name: Delete an authorization server
  method: DELETE
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}"
- name: Activate an authorization server
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/lifecycle/activate"
- name: Deactivate an authorization server
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/lifecycle/deactivate"
