---
name: Device
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all devices
  method: GET
  url: "{{baseUrl}}/api/v1/devices"
- name: Retrieve a device
  method: GET
  url: "{{baseUrl}}/api/v1/devices/{{deviceId}}"
- name: Delete a device
  method: DELETE
  url: "{{baseUrl}}/api/v1/devices/{{deviceId}}"
- name: Activate a device
  method: POST
  url: "{{baseUrl}}/api/v1/devices/{{deviceId}}/lifecycle/activate"
- name: Deactivate a device
  method: POST
  url: "{{baseUrl}}/api/v1/devices/{{deviceId}}/lifecycle/deactivate"
- name: Suspend a Device
  method: POST
  url: "{{baseUrl}}/api/v1/devices/{{deviceId}}/lifecycle/suspend"
- name: Unsuspend a Device
  method: POST
  url: "{{baseUrl}}/api/v1/devices/{{deviceId}}/lifecycle/unsuspend"
- name: List all OS accounts for a device
  method: GET
  url: "{{baseUrl}}/api/v1/devices/{{deviceId}}/os-accounts"
- name: Retrieve an OS account
  method: GET
  url: "{{baseUrl}}/api/v1/devices/{{deviceId}}/os-accounts/{{osAccountId}}"
- name: List all users for a device
  method: GET
  url: "{{baseUrl}}/api/v1/devices/{{deviceId}}/users"
