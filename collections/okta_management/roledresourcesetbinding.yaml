---
name: RoleDResourceSetBinding
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all role resource set bindings
  method: GET
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/bindings"
- name: Create a role resource set binding
  method: POST
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/bindings"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      role: cr0Yq6IJxGIr0ouum0g3
      members:
      - https://{yourOktaDomain}/api/v1/groups/00guaxWZ0AOa5NFAj0g3
- name: Retrieve a role resource set binding
  method: GET
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/bindings/{{roleIdOrLabel}}"
- name: Delete a role resource set binding
  method: DELETE
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/bindings/{{roleIdOrLabel}}"
