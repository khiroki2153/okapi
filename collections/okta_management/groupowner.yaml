---
name: GroupOwner
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all group owners
  method: GET
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/owners"
- name: Assign a group owner
  method: POST
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/owners"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      id: 00u1cmc03xjzePoWD0h8
      type: USER
- name: Delete a group owner
  method: DELETE
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/owners/{{ownerId}}"
