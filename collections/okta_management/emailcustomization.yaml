---
name: EmailCustomization
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Remove bounced emails
  method: POST
  url: "{{baseUrl}}/api/v1/org/email/bounces/remove-list"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      emailAddresses:
      - name@company.com
      - unknown.email@okta.com
      - name@okta@com
