---
name: GroupPushMapping
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all group push mappings
  method: GET
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/group-push/mappings"
- name: Create a group push mapping
  method: POST
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/group-push/mappings"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      sourceGroupId: 00g00000000000000000
      status: ACTIVE
      targetGroupName: NewGroup
- name: Retrieve a group push mapping
  method: GET
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/group-push/mappings/{{mappingId}}"
- name: Delete a group push mapping
  method: DELETE
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/group-push/mappings/{{mappingId}}"
- name: Update a group push mapping
  method: PATCH
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/group-push/mappings/{{mappingId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      status: INACTIVE
