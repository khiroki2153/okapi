---
name: Brands
requests:
- name: Brands / List all brands
  method: GET
  url: "{{baseUrl}}/api/v1/brands"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: Brands / Create a brand
  method: POST
  url: "{{baseUrl}}/api/v1/brands"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
      name: My Awesome Brand
- name: Brands / Retrieve a brand
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: Brands / Replace a brand
  method: PUT
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
      customPrivacyPolicyUrl: https://www.someHost.com/privacy-policy
      agreeToCustomPrivacyPolicy: true
      removePoweredByOkta: true
      name: New Name For Brand
      emailDomainId: OeD114iNkrcN6aR680g4
      locale: en
      defaultApp:
        appInstanceId: 0oa114iNkrcN6aR680g4
        appLinkName:
        classicApplicationUri:
- name: Brands / Delete a brand
  method: DELETE
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: Brands / List all domains associated with a brand
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/domains"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
