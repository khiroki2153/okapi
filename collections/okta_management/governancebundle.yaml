---
name: GovernanceBundle
requests:
- name: GovernanceBundle / List all governance bundles
  method: GET
  url: "{{baseUrl}}/api/v1/iam/governance/bundles"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: GovernanceBundle / Create a governance bundle
  method: POST
  url: "{{baseUrl}}/api/v1/iam/governance/bundles"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
      name: Group admin bundle
      description: Group bundle for administrative access
      entitlements:
        role: GROUP_MEMBERSHIP_ADMIN
- name: GovernanceBundle / Retrieve a governance bundle
  method: GET
  url: "{{baseUrl}}/api/v1/iam/governance/bundles/{{bundleId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: GovernanceBundle / Replace a governance bundle
  method: PUT
  url: "{{baseUrl}}/api/v1/iam/governance/bundles/{{bundleId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
      name: Group admin bundle
      description: Group bundle for administrative access
      entitlements:
        role: GROUP_MEMBERSHIP_ADMIN
- name: GovernanceBundle / Delete a governance bundle
  method: DELETE
  url: "{{baseUrl}}/api/v1/iam/governance/bundles/{{bundleId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: GovernanceBundle / List all entitlements for a governance bundle
  method: GET
  url: "{{baseUrl}}/api/v1/iam/governance/bundles/{{bundleId}}/entitlements"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: GovernanceBundle / List all values for a governance bundle entitlement
  method: GET
  url: "{{baseUrl}}/api/v1/iam/governance/bundles/{{bundleId}}/entitlements/{{entitlementId}}/values"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: GovernanceBundle / Retrieve the Admin Console opt-in status
  method: GET
  url: "{{baseUrl}}/api/v1/iam/governance/optIn"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: GovernanceBundle / Opt in the Admin Console to entitlement management
  method: POST
  url: "{{baseUrl}}/api/v1/iam/governance/optIn"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: GovernanceBundle / Opt out the Admin Console from entitlement management
  method: POST
  url: "{{baseUrl}}/api/v1/iam/governance/optOut"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
