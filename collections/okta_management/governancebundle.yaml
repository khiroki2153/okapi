---
name: GovernanceBundle
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all governance bundles
  method: GET
  url: "{{baseUrl}}/api/v1/iam/governance/bundles"
- name: Create a governance bundle
  method: POST
  url: "{{baseUrl}}/api/v1/iam/governance/bundles"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: Group admin bundle
      description: Group bundle for administrative access
      entitlements:
        role: GROUP_MEMBERSHIP_ADMIN
- name: Retrieve a governance bundle
  method: GET
  url: "{{baseUrl}}/api/v1/iam/governance/bundles/{{bundleId}}"
- name: Replace a governance bundle
  method: PUT
  url: "{{baseUrl}}/api/v1/iam/governance/bundles/{{bundleId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: Group admin bundle
      description: Group bundle for administrative access
      entitlements:
        role: GROUP_MEMBERSHIP_ADMIN
- name: Delete a governance bundle
  method: DELETE
  url: "{{baseUrl}}/api/v1/iam/governance/bundles/{{bundleId}}"
- name: List all entitlements for a governance bundle
  method: GET
  url: "{{baseUrl}}/api/v1/iam/governance/bundles/{{bundleId}}/entitlements"
- name: List all values for a governance bundle entitlement
  method: GET
  url: "{{baseUrl}}/api/v1/iam/governance/bundles/{{bundleId}}/entitlements/{{entitlementId}}/values"
- name: Retrieve the Admin Console opt-in status
  method: GET
  url: "{{baseUrl}}/api/v1/iam/governance/optIn"
- name: Opt in the Admin Console to entitlement management
  method: POST
  url: "{{baseUrl}}/api/v1/iam/governance/optIn"
- name: Opt out the Admin Console from entitlement management
  method: POST
  url: "{{baseUrl}}/api/v1/iam/governance/optOut"
