---
name: LogStream
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all log streams
  method: GET
  url: "{{baseUrl}}/api/v1/logStreams"
- name: Create a log stream
  method: POST
  url: "{{baseUrl}}/api/v1/logStreams"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      type: aws_eventbridge
      name: Example AWS EventBridge
      settings:
        eventSourceName: your-event-source-name
        accountId: '123456789012'
        region: us-east-2
- name: Retrieve a log stream
  method: GET
  url: "{{baseUrl}}/api/v1/logStreams/{{logStreamId}}"
- name: Replace a log stream
  method: PUT
  url: "{{baseUrl}}/api/v1/logStreams/{{logStreamId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      type: aws_eventbridge
      name: Updated AWS EventBridge
      settings:
        eventSourceName: your-event-source-name
        accountId: '123456789012'
        region: us-east-2
- name: Delete a log stream
  method: DELETE
  url: "{{baseUrl}}/api/v1/logStreams/{{logStreamId}}"
- name: Activate a log stream
  method: POST
  url: "{{baseUrl}}/api/v1/logStreams/{{logStreamId}}/lifecycle/activate"
- name: Deactivate a log stream
  method: POST
  url: "{{baseUrl}}/api/v1/logStreams/{{logStreamId}}/lifecycle/deactivate"
