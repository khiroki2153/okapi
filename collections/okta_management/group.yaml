---
name: Group
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all groups
  method: GET
  url: "{{baseUrl}}/api/v1/groups"
- name: Add a group
  method: POST
  url: "{{baseUrl}}/api/v1/groups"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve a group
  method: GET
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}"
- name: Replace a group
  method: PUT
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Delete a group
  method: DELETE
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}"
- name: List all assigned apps
  method: GET
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/apps"
- name: List all member users
  method: GET
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/users"
- name: Assign a user to a group
  method: PUT
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/users/{{userId}}"
- name: Unassign a user from a group
  method: DELETE
  url: "{{baseUrl}}/api/v1/groups/{{groupId}}/users/{{userId}}"
