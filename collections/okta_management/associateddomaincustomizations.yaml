---
name: AssociatedDomainCustomizations
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve the customized apple-app-site-association URI content
  method: GET
  url: "{{baseUrl}}/.well-known/apple-app-site-association"
- name: Retrieve the customized assetlinks.json URI content
  method: GET
  url: "{{baseUrl}}/.well-known/assetlinks.json"
- name: Retrieve the customized webauthn URI content
  method: GET
  url: "{{baseUrl}}/.well-known/webauthn"
- name: Retrieve all the well-known URIs
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/well-known-uris"
- name: Retrieve the well-known URI of a specific brand
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/well-known-uris/{{path}}"
- name: Retrieve the customized content of the specified well-known URI
  method: GET
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/well-known-uris/{{path}}/customized"
- name: Replace the customized well-known URI of the specific path
  method: PUT
  url: "{{baseUrl}}/api/v1/brands/{{brandId}}/well-known-uris/{{path}}/customized"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      representation:
        key1: value1
        key2: value2
        key3:
          key3.1: value3.1
