---
name: CAPTCHA
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all CAPTCHA instances
  method: GET
  url: "{{baseUrl}}/api/v1/captchas"
- name: Create a CAPTCHA instance
  method: POST
  url: "{{baseUrl}}/api/v1/captchas"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: myHCaptcha
      secretKey: xxxxxxxxxxx
      siteKey: xxxxxxxxxxx
      type: HCAPTCHA
- name: Retrieve a CAPTCHA instance
  method: GET
  url: "{{baseUrl}}/api/v1/captchas/{{captchaId}}"
- name: Replace a CAPTCHA instance
  method: PUT
  url: "{{baseUrl}}/api/v1/captchas/{{captchaId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: myHCaptcha
      secretKey: xxxxxxxxxxx
      siteKey: xxxxxxxxxxx
      type: HCAPTCHA
- name: Update a CAPTCHA instance
  method: POST
  url: "{{baseUrl}}/api/v1/captchas/{{captchaId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: myHCaptcha
      secretKey: xxxxxxxxxxx
      siteKey: xxxxxxxxxxx
      type: HCAPTCHA
- name: Delete a CAPTCHA instance
  method: DELETE
  url: "{{baseUrl}}/api/v1/captchas/{{captchaId}}"
- name: Retrieve the org-wide CAPTCHA settings
  method: GET
  url: "{{baseUrl}}/api/v1/org/captcha"
- name: Replace the org-wide CAPTCHA settings
  method: PUT
  url: "{{baseUrl}}/api/v1/org/captcha"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      captchaId: abcd4567
      enabledPages:
      - SSR
      - SIGN_IN
- name: Delete the org-wide CAPTCHA settings
  method: DELETE
  url: "{{baseUrl}}/api/v1/org/captcha"
