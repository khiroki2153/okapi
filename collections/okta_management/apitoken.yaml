---
name: ApiToken
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all API token metadata
  method: GET
  url: "{{baseUrl}}/api/v1/api-tokens"
- name: Revoke the current API token
  method: DELETE
  url: "{{baseUrl}}/api/v1/api-tokens/current"
- name: Retrieve an API token's metadata
  method: GET
  url: "{{baseUrl}}/api/v1/api-tokens/{{apiTokenId}}"
- name: Upsert an API token network condition
  method: PUT
  url: "{{baseUrl}}/api/v1/api-tokens/{{apiTokenId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: api_token_name
      clientName: client_name
      userId: 00uabcdefg1234567890
      network:
        connection: ANYWHERE
      created: '2021-11-09T20:38:10.000Z'
- name: Revoke an API token
  method: DELETE
  url: "{{baseUrl}}/api/v1/api-tokens/{{apiTokenId}}"
