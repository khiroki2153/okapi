---
name: Authenticator
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve the well-known app authenticator configuration
  method: GET
  url: "{{baseUrl}}/.well-known/app-authenticator-configuration"
- name: List all authenticators
  method: GET
  url: "{{baseUrl}}/api/v1/authenticators"
- name: Create an authenticator
  method: POST
  url: "{{baseUrl}}/api/v1/authenticators"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      key: duo
      name: Duo Security
      provider:
        type: DUO
        configuration:
          userNameTemplate:
            template: oktaId
          integrationKey: testIntegrationKey
          secretKey: testSecretKey
          host: https://api-xxxxxxxx.duosecurity.com
- name: Retrieve an authenticator
  method: GET
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}"
- name: Replace an authenticator
  method: PUT
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      key: duo
      name: Duo Security
      provider:
        type: DUO
        configuration:
          userNameTemplate:
            template: oktaId
          integrationKey: testIntegrationKey
          secretKey: testSecretKey
          host: https://api-xxxxxxxx.duosecurity.com
- name: List all custom AAGUIDs
  method: GET
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/aaguids"
- name: Create a custom AAGUID
  method: POST
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/aaguids"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      aaguid: cb69481e-8ff7-4039-93ec-0a272911111
      name: My Security Key
      authenticatorCharacteristics:
        platformAttached: false
        fipsCompliant: false
        hardwareProtected: false
      attestationRootCertificates:
      - x5c: X5C...
- name: Retrieve a custom AAGUID
  method: GET
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/aaguids/{{aaguid}}"
- name: Replace a custom AAGUID
  method: PUT
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/aaguids/{{aaguid}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: My Security Key
      authenticatorCharacteristics:
        platformAttached: false
        fipsCompliant: false
        hardwareProtected: false
      attestationRootCertificates:
      - x5c: X5C...
- name: Delete a custom AAGUID
  method: DELETE
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/aaguids/{{aaguid}}"
- name: Update a custom AAGUID
  method: PATCH
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/aaguids/{{aaguid}}"
- name: Activate an authenticator
  method: POST
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/lifecycle/activate"
- name: Deactivate an authenticator
  method: POST
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/lifecycle/deactivate"
- name: List all methods of an authenticator
  method: GET
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/methods"
- name: Retrieve an authenticator method
  method: GET
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/methods/{{methodType}}"
- name: Replace an authenticator method
  method: PUT
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/methods/{{methodType}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Activate an authenticator method
  method: POST
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/methods/{{methodType}}/lifecycle/activate"
- name: Deactivate an authenticator method
  method: POST
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/methods/{{methodType}}/lifecycle/deactivate"
- name: Verify a Relying Party ID domain
  method: POST
  url: "{{baseUrl}}/api/v1/authenticators/{{authenticatorId}}/methods/{{webAuthnMethodType}}/verify-rp-id-domain"
