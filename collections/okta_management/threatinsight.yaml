---
name: ThreatInsight
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve the ThreatInsight configuration
  method: GET
  url: "{{baseUrl}}/api/v1/threats/configuration"
- name: Update the ThreatInsight configuration
  method: POST
  url: "{{baseUrl}}/api/v1/threats/configuration"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      action: audit
      excludeZones:
      - nzo1q7jEOsoCnoKcj0g4
      - nzouagptWUz5DlLfM0g3
