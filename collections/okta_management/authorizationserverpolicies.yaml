---
name: AuthorizationServerPolicies
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all policies
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies"
- name: Create a policy
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      type: OAUTH_AUTHORIZATION_POLICY
      status: ACTIVE
      name: Default Policy
      description: Default policy description
      priority: 1
      system: false
      conditions:
        clients":
          include":
          - ALL_CLIENTS
- name: Retrieve a policy
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies/{{policyId}}"
- name: Replace a policy
  method: PUT
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies/{{policyId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      id: 00p5m9xrrBffPd9ah0g4
      type: OAUTH_AUTHORIZATION_POLICY
      status: ACTIVE
      name: Default Policy
      description: Default policy description
      priority: 1
      system: false
      conditions:
        clients":
          include":
          - ALL_CLIENTS
- name: Delete a policy
  method: DELETE
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies/{{policyId}}"
- name: Activate a policy
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies/{{policyId}}/lifecycle/activate"
- name: Deactivate a policy
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/policies/{{policyId}}/lifecycle/deactivate"
