---
name: RoleDResourceSetBindingMember
requests:
- name: RoleDResourceSetBindingMember / List all role resource set binding members
  method: GET
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/bindings/{{roleIdOrLabel}}/members"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: RoleDResourceSetBindingMember / Add more role resource set binding members
  method: PATCH
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/bindings/{{roleIdOrLabel}}/members"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
      additions:
      - https://{yourOktaDomain}/api/v1/groups/00guaxWZ0AOa5NFAj0g3
      - https://{yourOktaDomain}/api/v1/users/00u67DU2qNCjNZYO0g3
- name: RoleDResourceSetBindingMember / Retrieve a role resource set binding member
  method: GET
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/bindings/{{roleIdOrLabel}}/members/{{memberId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: RoleDResourceSetBindingMember / Unassign a role resource set binding member
  method: DELETE
  url: "{{baseUrl}}/api/v1/iam/resource-sets/{{resourceSetIdOrLabel}}/bindings/{{roleIdOrLabel}}/members/{{memberId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
