---
name: AuthorizationServerClaims
requests:
- name: AuthorizationServerClaims / List all custom token claims
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/claims"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: AuthorizationServerClaims / Create a custom token claim
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/claims"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
    - alwaysIncludeInToken: true
      claimType: IDENTITY
      conditions:
        scopes:
        - profile
      group_filter_type: CONTAINS
      name: Support
      status: ACTIVE
      system: false
      value: Support
      valueType: GROUPS
- name: AuthorizationServerClaims / Retrieve a custom token claim
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/claims/{{claimId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
- name: AuthorizationServerClaims / Replace a custom token claim
  method: PUT
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/claims/{{claimId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content:
    - alwaysIncludeInToken: true
      claimType: IDENTITY
      conditions:
        scopes:
        - profile
      group_filter_type: CONTAINS
      name: Knowledge_Base
      status: ACTIVE
      system: false
      value: Knowledge Base
      valueType: GROUPS
- name: AuthorizationServerClaims / Delete a custom token claim
  method: DELETE
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/claims/{{claimId}}"
  headers:
    Authorization: SSWS {{apiToken}}
    Accept: application/json
