---
name: IdentityProviderUsers
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all users for IdP
  method: GET
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/users"
- name: Retrieve a user for IdP
  method: GET
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/users/{{userId}}"
- name: Link a user to IdP
  method: POST
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/users/{{userId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Unlink a user from IdP
  method: DELETE
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/users/{{userId}}"
- name: List all tokens from OIDC IdP
  method: GET
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/users/{{userId}}/credentials/tokens"
- name: List all IdPs for user
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{id}}/idps"
