---
name: UserClassification
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve a user's classification
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/classification"
- name: Replace the user's classification
  method: PUT
  url: "{{baseUrl}}/api/v1/users/{{userId}}/classification"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      type: LITE
