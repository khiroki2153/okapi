---
name: AuthorizationServerAssoc
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all associated authorization servers
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/associatedServers"
- name: Create an associated authorization server
  method: POST
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/associatedServers"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
    - trusted: "{authorizationServerId}"
- name: Delete an associated authorization server
  method: DELETE
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/associatedServers/{{associatedServerId}}"
