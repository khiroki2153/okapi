---
name: OrgSettingContact
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all org contact types
  method: GET
  url: "{{baseUrl}}/api/v1/org/contacts"
- name: Retrieve the contact type user
  method: GET
  url: "{{baseUrl}}/api/v1/org/contacts/{{contactType}}"
- name: Replace the contact type user
  method: PUT
  url: "{{baseUrl}}/api/v1/org/contacts/{{contactType}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      userId: 00ux3u0ujW1r5AfZC1d7
