---
name: IdentityProviderSigningKeys
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all certificate signing requests
  method: GET
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/credentials/csrs"
- name: Generate a certificate signing request
  method: POST
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/credentials/csrs"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve a certificate signing request
  method: GET
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/credentials/csrs/{{idpCsrId}}"
- name: Revoke a certificate signing request
  method: DELETE
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/credentials/csrs/{{idpCsrId}}"
- name: Publish a certificate signing request
  method: POST
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/credentials/csrs/{{idpCsrId}}/lifecycle/publish"
- name: List all signing key credentials for IdP
  method: GET
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/credentials/keys"
- name: List the active signing key credential for IdP
  method: GET
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/credentials/keys/active"
- name: Generate a new signing key credential for IdP
  method: POST
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/credentials/keys/generate"
- name: Retrieve a signing key credential for IdP
  method: GET
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/credentials/keys/{{kid}}"
- name: Clone a signing key credential for IdP
  method: POST
  url: "{{baseUrl}}/api/v1/idps/{{idpId}}/credentials/keys/{{kid}}/clone"
