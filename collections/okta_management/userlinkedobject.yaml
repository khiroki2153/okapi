---
name: UserLinkedObject
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Assign a linked object value for primary
  method: PUT
  url: "{{baseUrl}}/api/v1/users/{{userIdOrLogin}}/linkedObjects/{{primaryRelationshipName}}/{{primaryUserId}}"
- name: List the primary or all of the associated linked object values
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userIdOrLogin}}/linkedObjects/{{relationshipName}}"
- name: Delete a linked object value
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userIdOrLogin}}/linkedObjects/{{relationshipName}}"
