---
name: Realm
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all realms
  method: GET
  url: "{{baseUrl}}/api/v1/realms"
- name: Create a realm
  method: POST
  url: "{{baseUrl}}/api/v1/realms"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      profile:
        name: Car Co
        realmType: PARTNER
        domains:
        - atko.com
        - user.com
- name: Retrieve a realm
  method: GET
  url: "{{baseUrl}}/api/v1/realms/{{realmId}}"
- name: Replace the realm profile
  method: PUT
  url: "{{baseUrl}}/api/v1/realms/{{realmId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      profile:
        name: Car Co
        realmType: PARTNER
        domains:
        - atko.com
        - user.com
- name: Delete a realm
  method: DELETE
  url: "{{baseUrl}}/api/v1/realms/{{realmId}}"
