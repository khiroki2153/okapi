---
name: AuthorizationServerClients
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all client resources for an authorization server
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/clients"
- name: List all refresh tokens for a client
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/clients/{{clientId}}/tokens"
- name: Revoke all refresh tokens for a client
  method: DELETE
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/clients/{{clientId}}/tokens"
- name: Retrieve a refresh token for a client
  method: GET
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/clients/{{clientId}}/tokens/{{tokenId}}"
- name: Revoke a refresh token for a client
  method: DELETE
  url: "{{baseUrl}}/api/v1/authorizationServers/{{authServerId}}/clients/{{clientId}}/tokens/{{tokenId}}"
