---
name: ApplicationSSOPublicKeys
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all the OAuth 2.0 client JSON Web Keys
  method: GET
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/credentials/jwks"
- name: Add a JSON Web Key
  method: POST
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/credentials/jwks"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      id: pks2f50kZB0cITmYU0g4
      kid: ASHJHGasa782333-Sla3x3POBiIxDreBCdZuFs5B
      kty: RSA
      alg: RS256
      use: sig
      e: AQAB
      "n": AJncrzOrouIUCSMlRL0HU.....Kuine49_CEVR4GPn=
      status: ACTIVE
- name: Retrieve an OAuth 2.0 client JSON Web Key
  method: GET
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/credentials/jwks/{{keyId}}"
- name: Delete an OAuth 2.0 client JSON Web Key
  method: DELETE
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/credentials/jwks/{{keyId}}"
- name: Activate an OAuth 2.0 client JSON Web Key
  method: POST
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/credentials/jwks/{{keyId}}/lifecycle/activate"
- name: Deactivate an OAuth 2.0 client JSON Web Key
  method: POST
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/credentials/jwks/{{keyId}}/lifecycle/deactivate"
- name: List all OAuth 2.0 client secrets
  method: GET
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/credentials/secrets"
- name: Create an OAuth 2.0 client secret
  method: POST
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/credentials/secrets"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve an OAuth 2.0 client secret
  method: GET
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/credentials/secrets/{{secretId}}"
- name: Delete an OAuth 2.0 client secret
  method: DELETE
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/credentials/secrets/{{secretId}}"
- name: Activate an OAuth 2.0 client secret
  method: POST
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/credentials/secrets/{{secretId}}/lifecycle/activate"
- name: Deactivate an OAuth 2.0 client secret
  method: POST
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/credentials/secrets/{{secretId}}/lifecycle/deactivate"
