---
name: ApiServiceIntegrations
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all API service integration instances
  method: GET
  url: "{{baseUrl}}/integrations/api/v1/api-services"
- name: Create an API service integration instance
  method: POST
  url: "{{baseUrl}}/integrations/api/v1/api-services"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      type: my_app_cie
      grantedScopes:
      - okta.logs.read
      - okta.groups.read
      - okta.users.read
- name: Retrieve an API service integration instance
  method: GET
  url: "{{baseUrl}}/integrations/api/v1/api-services/{{apiServiceId}}"
- name: Delete an API service integration instance
  method: DELETE
  url: "{{baseUrl}}/integrations/api/v1/api-services/{{apiServiceId}}"
- name: List all API service integration instance secrets
  method: GET
  url: "{{baseUrl}}/integrations/api/v1/api-services/{{apiServiceId}}/credentials/secrets"
- name: Create an API service integration instance secret
  method: POST
  url: "{{baseUrl}}/integrations/api/v1/api-services/{{apiServiceId}}/credentials/secrets"
- name: Delete an API service integration instance secret
  method: DELETE
  url: "{{baseUrl}}/integrations/api/v1/api-services/{{apiServiceId}}/credentials/secrets/{{secretId}}"
- name: Activate an API service integration instance secret
  method: POST
  url: "{{baseUrl}}/integrations/api/v1/api-services/{{apiServiceId}}/credentials/secrets/{{secretId}}/lifecycle/activate"
- name: Deactivate an API service integration instance secret
  method: POST
  url: "{{baseUrl}}/integrations/api/v1/api-services/{{apiServiceId}}/credentials/secrets/{{secretId}}/lifecycle/deactivate"
