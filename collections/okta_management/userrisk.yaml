---
name: UserRisk
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve the user's risk
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/risk"
- name: Upsert the user's risk
  method: PUT
  url: "{{baseUrl}}/api/v1/users/{{userId}}/risk"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      riskLevel: HIGH
