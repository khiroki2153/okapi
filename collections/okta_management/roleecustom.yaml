---
name: RoleECustom
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all custom roles
  method: GET
  url: "{{baseUrl}}/api/v1/iam/roles"
- name: Create a custom role
  method: POST
  url: "{{baseUrl}}/api/v1/iam/roles"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      label: UserCreator
      description: Create users
      permissions:
      - okta.users.create
      - okta.users.read
      - okta.groups.read
      - okta.users.userprofile.manage
- name: Retrieve a role
  method: GET
  url: "{{baseUrl}}/api/v1/iam/roles/{{roleIdOrLabel}}"
- name: Replace a custom role
  method: PUT
  url: "{{baseUrl}}/api/v1/iam/roles/{{roleIdOrLabel}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      label: UserCreator
      description: Create users
- name: Delete a custom role
  method: DELETE
  url: "{{baseUrl}}/api/v1/iam/roles/{{roleIdOrLabel}}"
