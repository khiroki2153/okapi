---
name: RoleBTargetClient
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all client role app targets
  method: GET
  url: "{{baseUrl}}/oauth2/v1/clients/{{clientId}}/roles/{{roleAssignmentId}}/targets/catalog/apps"
- name: Assign a client role app target
  method: PUT
  url: "{{baseUrl}}/oauth2/v1/clients/{{clientId}}/roles/{{roleAssignmentId}}/targets/catalog/apps/{{appName}}"
- name: Unassign a client role app target
  method: DELETE
  url: "{{baseUrl}}/oauth2/v1/clients/{{clientId}}/roles/{{roleAssignmentId}}/targets/catalog/apps/{{appName}}"
- name: Assign a client role app instance target
  method: PUT
  url: "{{baseUrl}}/oauth2/v1/clients/{{clientId}}/roles/{{roleAssignmentId}}/targets/catalog/apps/{{appName}}/{{appId}}"
- name: Unassign a client role app instance target
  method: DELETE
  url: "{{baseUrl}}/oauth2/v1/clients/{{clientId}}/roles/{{roleAssignmentId}}/targets/catalog/apps/{{appName}}/{{appId}}"
- name: List all client role group targets
  method: GET
  url: "{{baseUrl}}/oauth2/v1/clients/{{clientId}}/roles/{{roleAssignmentId}}/targets/groups"
- name: Assign a client role group target
  method: PUT
  url: "{{baseUrl}}/oauth2/v1/clients/{{clientId}}/roles/{{roleAssignmentId}}/targets/groups/{{groupId}}"
- name: Unassign a client role group target
  method: DELETE
  url: "{{baseUrl}}/oauth2/v1/clients/{{clientId}}/roles/{{roleAssignmentId}}/targets/groups/{{groupId}}"
