---
name: SSFReceiver
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all security events providers
  method: GET
  url: "{{baseUrl}}/api/v1/security-events-providers"
- name: Create a security events provider
  method: POST
  url: "{{baseUrl}}/api/v1/security-events-providers"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: Security events provider with well-known URL
      type: okta
      settings:
        well_known_url: https://example.okta.com/.well-known/ssf-configuration
- name: Retrieve the security events provider
  method: GET
  url: "{{baseUrl}}/api/v1/security-events-providers/{{securityEventProviderId}}"
- name: Replace a security events provider
  method: PUT
  url: "{{baseUrl}}/api/v1/security-events-providers/{{securityEventProviderId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: Security events provider with well-known URL
      type: okta
      settings:
        well_known_url: https://example.okta.com/.well-known/ssf-configuration
- name: Delete a security events provider
  method: DELETE
  url: "{{baseUrl}}/api/v1/security-events-providers/{{securityEventProviderId}}"
- name: Activate a security events provider
  method: POST
  url: "{{baseUrl}}/api/v1/security-events-providers/{{securityEventProviderId}}/lifecycle/activate"
- name: Deactivate a security events provider
  method: POST
  url: "{{baseUrl}}/api/v1/security-events-providers/{{securityEventProviderId}}/lifecycle/deactivate"
