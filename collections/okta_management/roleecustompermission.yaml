---
name: RoleECustomPermission
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all custom role permissions
  method: GET
  url: "{{baseUrl}}/api/v1/iam/roles/{{roleIdOrLabel}}/permissions"
- name: Retrieve a custom role permission
  method: GET
  url: "{{baseUrl}}/api/v1/iam/roles/{{roleIdOrLabel}}/permissions/{{permissionType}}"
- name: Replace a custom role permission
  method: PUT
  url: "{{baseUrl}}/api/v1/iam/roles/{{roleIdOrLabel}}/permissions/{{permissionType}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      conditions:
        include:
          okta:ResourceAttribute/User/Profile:
          - city
          - state
- name: Create a custom role permission
  method: POST
  url: "{{baseUrl}}/api/v1/iam/roles/{{roleIdOrLabel}}/permissions/{{permissionType}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      conditions:
        include:
          okta:ResourceAttribute/User/Profile:
          - city
          - state
- name: Delete a custom role permission
  method: DELETE
  url: "{{baseUrl}}/api/v1/iam/roles/{{roleIdOrLabel}}/permissions/{{permissionType}}"
