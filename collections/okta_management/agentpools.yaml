---
name: AgentPools
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all agent pools
  method: GET
  url: "{{baseUrl}}/api/v1/agentPools"
- name: List all agent pool updates
  method: GET
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates"
- name: Create an agent pool update
  method: POST
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve an agent pool update's settings
  method: GET
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates/settings"
- name: Update an agent pool update settings
  method: POST
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates/settings"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve an agent pool update by ID
  method: GET
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates/{{updateId}}"
- name: Update an agent pool update by ID
  method: POST
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates/{{updateId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Delete an agent pool update
  method: DELETE
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates/{{updateId}}"
- name: Activate an agent pool update
  method: POST
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates/{{updateId}}/activate"
- name: Deactivate an agent pool update
  method: POST
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates/{{updateId}}/deactivate"
- name: Pause an agent pool update
  method: POST
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates/{{updateId}}/pause"
- name: Resume an agent pool update
  method: POST
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates/{{updateId}}/resume"
- name: Retry an agent pool update
  method: POST
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates/{{updateId}}/retry"
- name: Stop an agent pool update
  method: POST
  url: "{{baseUrl}}/api/v1/agentPools/{{poolId}}/updates/{{updateId}}/stop"
