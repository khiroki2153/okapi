---
name: BotProtection
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve the bot protection configuration
  method: GET
  url: "{{baseUrl}}/api/v1/bot-protection/configuration"
- name: Update the bot protection configuration
  method: POST
  url: "{{baseUrl}}/api/v1/bot-protection/configuration"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      level: LOW
      mode: LOG_ONLY
      supportedFlows:
      - SIGN_IN
      - SSR
      - SSPR
