---
name: RoleBTargetAdmin
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all admin role app targets
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}/targets/catalog/apps"
- name: Assign all apps as target to admin role
  method: PUT
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}/targets/catalog/apps"
- name: Assign an admin role app target
  method: PUT
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}/targets/catalog/apps/{{appName}}"
- name: Unassign an admin role app target
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}/targets/catalog/apps/{{appName}}"
- name: Assign an admin role app instance target
  method: PUT
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}/targets/catalog/apps/{{appName}}/{{appId}}"
- name: Unassign an admin role app instance target
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}/targets/catalog/apps/{{appName}}/{{appId}}"
- name: List all admin role group targets
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}/targets/groups"
- name: Assign an admin role group target
  method: PUT
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}/targets/groups/{{groupId}}"
- name: Unassign an admin role group target
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleAssignmentId}}/targets/groups/{{groupId}}"
- name: Retrieve a role target by assignment type
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/roles/{{roleIdOrEncodedRoleId}}/targets"
