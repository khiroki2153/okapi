---
name: IdentityProviderKeys
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all IdP key credentials
  method: GET
  url: "{{baseUrl}}/api/v1/idps/credentials/keys"
- name: Create an IdP key credential
  method: POST
  url: "{{baseUrl}}/api/v1/idps/credentials/keys"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve an IdP key credential
  method: GET
  url: "{{baseUrl}}/api/v1/idps/credentials/keys/{{kid}}"
- name: Replace an IdP key credential
  method: PUT
  url: "{{baseUrl}}/api/v1/idps/credentials/keys/{{kid}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      e: '65537'
      "n": ''
      x5c:
      - 
      x5t#S256: wzPVobIrveR1x-PCbjsFGNV-6zn7Rm9KuOWOG4Rk6jE
- name: Delete an IdP key credential
  method: DELETE
  url: "{{baseUrl}}/api/v1/idps/credentials/keys/{{kid}}"
