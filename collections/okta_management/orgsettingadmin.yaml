---
name: OrgSettingAdmin
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: Retrieve the org third-party admin setting
  method: GET
  url: "{{baseUrl}}/api/v1/org/orgSettings/thirdPartyAdminSetting"
- name: Update the org third-party admin setting
  method: POST
  url: "{{baseUrl}}/api/v1/org/orgSettings/thirdPartyAdminSetting"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve the Okta Admin Console assignment setting
  method: GET
  url: "{{baseUrl}}/api/v1/org/settings/autoAssignAdminAppSetting"
- name: Update the Okta Admin Console assignment setting
  method: POST
  url: "{{baseUrl}}/api/v1/org/settings/autoAssignAdminAppSetting"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
- name: Retrieve the default public client app role setting
  method: GET
  url: "{{baseUrl}}/api/v1/org/settings/clientPrivilegesSetting"
- name: Assign the default public client app role setting
  method: PUT
  url: "{{baseUrl}}/api/v1/org/settings/clientPrivilegesSetting"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: {}
