---
name: Behavior
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all behavior detection rules
  method: GET
  url: "{{baseUrl}}/api/v1/behaviors"
- name: Create a behavior detection rule
  method: POST
  url: "{{baseUrl}}/api/v1/behaviors"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: My Behavior Rule
      type: VELOCITY
- name: Retrieve a behavior detection rule
  method: GET
  url: "{{baseUrl}}/api/v1/behaviors/{{behaviorId}}"
- name: Replace a behavior detection rule
  method: PUT
  url: "{{baseUrl}}/api/v1/behaviors/{{behaviorId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      name: My Behavior Rule
      type: VELOCITY
- name: Delete a behavior detection rule
  method: DELETE
  url: "{{baseUrl}}/api/v1/behaviors/{{behaviorId}}"
- name: Activate a behavior detection rule
  method: POST
  url: "{{baseUrl}}/api/v1/behaviors/{{behaviorId}}/lifecycle/activate"
- name: Deactivate a behavior detection rule
  method: POST
  url: "{{baseUrl}}/api/v1/behaviors/{{behaviorId}}/lifecycle/deactivate"
