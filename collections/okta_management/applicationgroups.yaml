---
name: ApplicationGroups
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all application groups
  method: GET
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/groups"
- name: Retrieve an application group
  method: GET
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/groups/{{groupId}}"
- name: Assign an application group
  method: PUT
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/groups/{{groupId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      id: 00g15acRUy0SYb9GT0g4
      profile:
        preferredLanguage: English
        manager: Arsene Wenger
        securityQuestion: Who is the footballer to have played the game
        securityAnswer: Jay Jay Okocha
        timezone: Canada/Eastern
        initialStatus: active_with_pass
        managerId: ike.ogb@gmail.com
        locale: en_US
        division: top
        organization:
        userType:
        department: Accounting
- name: Unassign an application group
  method: DELETE
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/groups/{{groupId}}"
- name: Update an application group
  method: PATCH
  url: "{{baseUrl}}/api/v1/apps/{{appId}}/groups/{{groupId}}"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
    - op: replace
      path: "/profile/manager"
      value: Carlo Ancelotti
