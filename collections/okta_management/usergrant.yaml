---
name: UserGrant
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all grants for a client
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/clients/{{clientId}}/grants"
- name: Revoke all grants for a client
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}/clients/{{clientId}}/grants"
- name: List all user grants
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/grants"
- name: Revoke all user grants
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}/grants"
- name: Retrieve a user grant
  method: GET
  url: "{{baseUrl}}/api/v1/users/{{userId}}/grants/{{grantId}}"
- name: Revoke a user grant
  method: DELETE
  url: "{{baseUrl}}/api/v1/users/{{userId}}/grants/{{grantId}}"
