---
name: RoleAssignmentClient
headers:
  Authorization: SSWS {{apiToken}}
  Accept: application/json
requests:
- name: List all client role assignments
  method: GET
  url: "{{baseUrl}}/oauth2/v1/clients/{{clientId}}/roles"
- name: Assign a client role
  method: POST
  url: "{{baseUrl}}/oauth2/v1/clients/{{clientId}}/roles"
  headers:
    Content-Type: application/json
  body:
    type: json
    content:
      type: HELP_DESK_ADMIN
- name: Retrieve a client role
  method: GET
  url: "{{baseUrl}}/oauth2/v1/clients/{{clientId}}/roles/{{roleAssignmentId}}"
- name: Unassign a client role
  method: DELETE
  url: "{{baseUrl}}/oauth2/v1/clients/{{clientId}}/roles/{{roleAssignmentId}}"
